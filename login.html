<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ASSH</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="login-page">

    <div class="login-container">
        <a href="index.html" class="logo-login">ASSH</a>
        <form class="login-form">
            <div class="input-group">
                <i class="fa-regular fa-user"></i>
                <input type="email" placeholder=" " required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password-field" placeholder=" " required>
                <i class="fa-regular fa-eye-slash" id="toggle-password"></i>
            </div>
            <a href="#" class="forgot-password">ESQUECEU A SENHA?</a>
            <button type="submit" class="btn btn-login">Entrar</button>
            <div class="separator">Ou</div>
            <button type="button" class="btn btn-register">Cadastre-se</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>

</html>
